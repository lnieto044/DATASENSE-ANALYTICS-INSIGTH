# Blueprint de Render: sitio de demostración de DataSense (datos ficticios).
# En Render: New > Blueprint > elegir este repositorio > Apply. Todo lo demás está en el Dockerfile.
services:
  - type: web
    name: datasense-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin/login.php
    autoDeploy: true
    envVars:
      # Clave del usuario de la base dentro del contenedor (Render la genera)
      - key: DB_PASS
        generateValue: true
      - key: APP_ENV
        value: demo
      # Pagos en modo simulador: nadie paga de verdad en la demostración
      - key: PAGOS_ENTORNO
        value: LOCAL
      # Correo desactivado a propósito: el servidor 127.0.0.1:9 rechaza la conexión y la plataforma sigue sin enviar
      - key: MAIL_HOST
        value: 127.0.0.1
      - key: MAIL_PORT
        value: "9"
      - key: MAIL_ENCRYPTION
        value: none
      - key: MAIL_USER
        value: demo@example.com
      - key: MAIL_PASS
        value: demo
      # Redes sociales de DataSense (direcciones públicas): salen en el pie de página y en el canal de PQRSD
      - key: SOCIAL_FACEBOOK
        value: https://www.facebook.com/profile.php?id=61596210356006
      - key: SOCIAL_INSTAGRAM
        value: https://www.instagram.com/datasenseanalyticsinsigth/
      - key: SOCIAL_LINKEDIN
        value: https://www.linkedin.com/company/datasense-analytics-insights
      # Publicación automática en redes: el valor se escribe en Render (Environment), nunca en el repositorio
      - key: META_PAGE_TOKEN
        sync: false
      - key: LINKEDIN_TOKEN
        sync: false
      - key: LINKEDIN_ORG_ID
        sync: false
