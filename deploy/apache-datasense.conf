# Apache del contenedor de demostración

# Render atiende por HTTPS y reenvía por HTTP: así PHP sabe que la conexión es segura (cookies seguras, enlaces https)
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Es una copia del sitio con datos ficticios: que los buscadores no la indexen ni compita con el sitio real
Header always set X-Robots-Tag "noindex, nofollow"

ServerTokens Prod
ServerSignature Off

# Plan gratuito de Render: 512 MB de memoria compartidos con MariaDB
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          4
    MaxRequestWorkers        6
    MaxConnectionsPerChild 500
</IfModule>
