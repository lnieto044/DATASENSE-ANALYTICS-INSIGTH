; PHP del contenedor de demostración
; Las variables de entorno de Render (DB_*, MAIL_*, PAGOS_ENTORNO...) llegan a $_ENV
variables_order = "EGPCS"
date.timezone = America/Bogota
memory_limit = 192M
upload_max_filesize = 8M
post_max_size = 12M
max_execution_time = 60
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
session.use_strict_mode = 1
